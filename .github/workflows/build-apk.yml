name: Build Dynamic Island APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Unpack Updated Code
      run: |
        if [ -f "dynamic-island-pixel6pro-github.zip" ]; then
          echo "Found dynamic-island-pixel6pro-github.zip! Extracting..."
          unzip -o dynamic-island-pixel6pro-github.zip
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Initialize Gradle Wrapper & Build APK
      run: |
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload Dynamic Island APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DynamicIsland-Pixel6Pro-APK
        path: |
          **/app/build/outputs/apk/debug/app-debug.apk

    - name: Create / Update GitHub Release
      uses: softprops/action-gh-release@v2
      if: success()
      continue-on-error: true
      with:
        tag_name: v1.0.0-pixel6pro
        name: "Dynamic Island for Google Pixel 6 Pro v1.0.0"
        files: app/build/outputs/apk/debug/app-debug.apk
